<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eceef2" />
    <meta
      name="description"
      content="Edit your video by talking to it. Tell Lypcut what you want in Hindi, Hinglish or English, and get Reels-ready 9:16 exports."
    />
    <title>Lypcut</title>
    <script>
      // Light is the default. Apply a theme the person chose with the toggle before first paint, so there is no flash.
      try {
        var t = localStorage.getItem('lypcut-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
